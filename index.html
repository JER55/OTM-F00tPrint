<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💭☣️Simon_F00TPrint💭☣️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050a12; }
    #fp-container {
      position: fixed; inset: 0;
      background: #050a12;
      font-family: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
      color: #dde4f0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <div id="fp-container"></div>
<script>
// ============================================================================
// kiyotaka-footprint.js  -  Aggregated Volume Footprint (Kiyotaka style)
// ----------------------------------------------------------------------------
// Real order-flow footprint: per-candle bid x ask volume matrix by price level,
// imbalance / POC highlighting, plus a Visible-Range Volume Profile (VRVP).
// Data is reconstructed from Binance Futures aggTrades:
//   - seed: paginated REST history (newest -> back)
//   - live: aggTrade WebSocket, accumulated per candle/price bucket
// Aggressor side from `m` (isBuyerMaker): m=true -> SELL, m=false -> BUY.
// Pure <canvas> render (no chart lib). Self-contained overlay.
//
// Public API (unchanged):  window.KiyotakaFootprint = {
//   start(), stop(), toggle(), isOpen(), open(), close(), refresh(),
//   mount(elOrId), setTF(tf)
// }
// Entry point: the in-chart FP button (bitget-chart-widget.js).
// ============================================================================
window.KiyotakaFootprint = (function () {
  'use strict';

  // -- palette ----------------------------------------------------------------
  var C = {
    bg:     '#05080d',   // deep midnight (top)
    bg2:    '#0a0f18',   // gradient bottom
    panel:  '#0c1119',   // card fill
    panel2: '#0f1622',   // card fill alt
    grid:   '#19212f',
    border: '#232d40',
    borderHi: '#33405a', // lit edge / top highlight
    text:   '#f2f5fb',
    dim:    '#6c768c',
    buy:    '#0e5c4a',   // ask-dominant fill base
    sell:   '#6c1d32',   // bid-dominant fill base
    buyHi:  '#26e0a6',   // strong buy (mint)
    sellHi: '#ff506e',   // strong sell (coral)
    candle: '#ffc24d',   // candle / POC (amber-gold)
    line:   '#ffc24d',
    cvd:    '#4ea2ff',   // CVD azure
    oi:     '#ffb020',   // OI amber
    accent: '#7c9cff',   // institutional indigo accent
    glow:   '#26e0a6'
  };
  var FONT = 'Inter, "SF Pro Display", system-ui, sans-serif';

  // -- endpoints --------------------------------------------------------------
  var WS_URL   = 'wss://fstream.binance.com/market/stream?streams=btcusdt@aggTrade';
  var REST_AGG = 'https://fapi.binance.com/fapi/v1/aggTrades';
  var SYMBOL   = 'BTCUSDT';

  var TF_SEC    = { '1m': 60, '3m': 180, '5m': 300, '15m': 900, '1h': 3600 };
  var TF_BUCKET = { '1m': 5, '3m': 10, '5m': 10, '15m': 20, '1h': 50 };
  var MAX_CANDLES = 600;
  var SEED_MAX_CALLS = 60;
  var DETAIL_CANDLES = { '1m': 24, '3m': 14, '5m': 10 };
  // Single-speed seed: ambition in clock-hours of real order-flow history per TF.
  // The backward aggTrade pager stops at whichever comes first: this target OR
  // SEED_MAX_CALLS (rate-limit cap). On hot tape high TFs stop on calls, not time.
  var SEED_TARGET_HOURS = { '1m': 4, '3m': 8, '5m': 12, '15m': 24, '1h': 48 };

  // -- state ------------------------------------------------------------------
  var _el = null, _host = null, _canvas = null, _ctx = null;
  var _orderPanel = null;
  var _statusEl = null, _ohlcEl = null;
  var _seedProg = 0;
  var _tf = '1m';
  var _bucket = TF_BUCKET['1m'];
  var _candles = [];
  var _cmap = {};
  var _ws = null, _wsAlive = false, _wsRetry = null;
  var _cvdDeltas = [];
  var _oiArr = [];
  var _subTimer = null;
  var _running = false, _drawTimer = null, _dirty = false, _seeding = false, _raf = null;
  var _headless = false;   // KYO 24/7 feed: data layer running without DOM overlay / draw loop
  var _lastTickAt = 0, _visBound = false;
  var _dpr = 1;
  var _viewOffset = 0;
  var _visN = null;
  var _drag = null;
  var _winBound = false;
  var _lastColW = 60, _lastFitCols = 14;
  var _lastPlotW = 800, _lastPadL = 6;
  // -- big-volume highlight (M-tier) ------------------------------------------
  // Mode: 'auto' => rolling-percentile of recent per-level USD prints (regime
  // adaptive); 'fixed' => user-pinned notional (1/3/5/10M). Default = auto.
  var _BIG_MODE = (function () {
    var raw = localStorage.getItem('kiyo_fp_bigthresh');
    if (raw === 'auto' || raw == null || raw === '') return 'auto';
    var n = parseFloat(raw);
    return (n === 1e6 || n === 3e6 || n === 5e6 || n === 10e6) ? 'fixed' : 'auto';
  })();
  var _BIG_FIXED = (function () {
    var n = parseFloat(localStorage.getItem('kiyo_fp_bigthresh'));
    return (n === 1e6 || n === 3e6 || n === 5e6 || n === 10e6) ? n : 3e6;
  })();
  var _BIG_PCTL = 0.96;           // percentile cut for "big" in auto mode
  var _BIG_FLOOR = 2.5e5;         // never call sub-250k USD "big" on dead tape
  var _BIG_THRESH = _BIG_FIXED;   // EFFECTIVE threshold (recomputed each draw if auto)
  var _bigDir = 0, _bigUsd = 0;   // last-candle dominant big-flow direction/magnitude

  // -- session cumulative delta (USD notional, reset on each (re)seed) ---------
  var _cumulativeDelta = 0;
  var _sessionDelta = 0;
  var _sessionAnchorMsVal = 0;   // live US-session anchor (ms); rollover sentinel
  var _sessionHigh = -Infinity, _sessionLow = Infinity;
  var _mouse = null;
  var _geo = null;
  var _tickCount = 0;
  var _lastAnimCheck = 0;
  var _pollTimer = null;  // fallback polling
  var _lastAggId = -1;    // last ingested aggregate-trade id (dedupe across WS/poll/seed)

  // -- SL/TP drag overlay on footprint ------------------------------------------
  var _fpDragLayer = null;
  var _fpDragCleanup = null;
  var _fpDragActive = false;

  // -- DST-aware Europe/Rome offset --------------------------------------------
  var _tzCache = { exp: 0, sec: 7200 };
  function _romeOffsetSec() {
    var now = Date.now();
    if (now < _tzCache.exp) return _tzCache.sec;
    var dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Europe/Rome', hour12: false, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    var p = dtf.formatToParts(new Date(now)), m = {};
    for (var i = 0; i < p.length; i++) m[p[i].type] = p[i].value;
    var hh = parseInt(m.hour, 10); if (hh === 24) hh = 0;
    var asUTC = Date.UTC(+m.year, +m.month - 1, +m.day, hh, +m.minute, +m.second);
    var sec = Math.round((asUTC - now) / 1000);
    _tzCache = { exp: now + 60000, sec: sec };
    return sec;
  }

  // -- US-session anchor (09:30 America/New_York, DST-aware) -------------------
  // Δ SESSION accumulates from this anchor and rolls once per day at the US open.
  // Same wall-clock => same anchor, so refresh / TF-change / reopen do NOT reset
  // it; only crossing the next 09:30 ET advances the anchor. Convention matches
  // session-volume-profile.js (window.SessionVP).
  function _nyOffsetMs(utcMs) {
    var dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', hour12: false, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    var p = dtf.formatToParts(new Date(utcMs)), m = {};
    for (var i = 0; i < p.length; i++) m[p[i].type] = p[i].value;
    var hh = parseInt(m.hour, 10); if (hh === 24) hh = 0;
    var asUTC = Date.UTC(+m.year, +m.month - 1, +m.day, hh, +m.minute, +m.second);
    return asUTC - utcMs;
  }
  function _nyWallToUtc(y, mo, d, h, mi) {
    var wall = Date.UTC(y, mo, d, h, mi, 0);
    return wall - _nyOffsetMs(wall);
  }
  function _nyDateParts(utcMs) {
    var dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
    });
    var p = dtf.formatToParts(new Date(utcMs)), m = {};
    for (var i = 0; i < p.length; i++) m[p[i].type] = p[i].value;
    return { y: +m.year, mo: +m.month - 1, d: +m.day };
  }
  var _sessAnchorCache = { exp: 0, ms: 0 };
  function _sessionAnchorMs() {
    var now = Date.now();
    if (now < _sessAnchorCache.exp && _sessAnchorCache.ms) return _sessAnchorCache.ms;
    var ny = _nyDateParts(now);
    var todayOpen = _nyWallToUtc(ny.y, ny.mo, ny.d, 9, 30);
    var anchor = todayOpen;
    if (now < todayOpen) {                                  // before today's open -> prior session
      var probe = _nyWallToUtc(ny.y, ny.mo, ny.d, 12, 0) - 86400000;  // midday -1d (DST-safe)
      var pny = _nyDateParts(probe);
      anchor = _nyWallToUtc(pny.y, pny.mo, pny.d, 9, 30);
    }
    _sessAnchorCache = { exp: now + 60000, ms: anchor };
    return anchor;
  }

  function _fmt(v) {
    var a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    if (a >= 100) return v.toFixed(0);
    return v.toFixed(1);
  }
  function _price(p) {
    return p.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function _rgba(hex, a) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16),
        g = parseInt(h.substring(2, 4), 16),
        b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function _hex2rgb(hex) { var h = hex.replace('#', '');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
  function _mix(h1, h2, t) { var a = _hex2rgb(h1), b = _hex2rgb(h2);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' + Math.round(a[1]+(b[1]-a[1])*t) + ',' + Math.round(a[2]+(b[2]-a[2])*t) + ')'; }
  function _mixA(h1, h2, t, al) { var a = _hex2rgb(h1), b = _hex2rgb(h2);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return 'rgba(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' + Math.round(a[1]+(b[1]-a[1])*t) + ',' + Math.round(a[2]+(b[2]-a[2])*t) + ',' + al + ')'; }
  function _deltaColor(dr) {
    if (dr >= 0) return _mix(C.candle, C.buyHi, Math.min(1, dr / 0.6));
    return _mix(C.candle, C.sellHi, Math.min(1, -dr / 0.6));
  }
  function _roundRect(ctx, x, y, w, h, r) {
    if (w < 0) w = 0; if (h < 0) h = 0;
    if (w < 2*r) r = w/2; if (h < 2*r) r = h/2;
    if (r < 0) r = 0;
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function _levelsAt(c, bucket) {
    var out = {};
    for (var k in c.levels) { var bk = Math.floor((+k)/bucket)*bucket;
      var o = out[bk]; if (!o) { o = { b:0, s:0 }; out[bk] = o; }
      o.b += c.levels[k].b; o.s += c.levels[k].s; }
    return out;
  }
  function _aggNow() {
    var n = _candles.length; if (!n) return null;
    var B = 0, S = 0, w = 1;
    for (var i = n - 1; i >= 0 && i >= n - 5; i--) { B += _candles[i].totB * w; S += _candles[i].totS * w; w *= 0.62; }
    var t = B + S; if (t <= 0) return { buy: 0.5, usd: 0 };
    var lc = _candles[n - 1], px = lc.c || 0;
    return { buy: B / t, usd: (lc.totB - lc.totS) * px };
  }

  // -- candle / footprint accumulation ----------------------------------------
  function _tfSec() { return TF_SEC[_tf] || 300; }
  function _bucketOf(price) { return Math.floor(price / _bucket) * _bucket; }

  function _getCandle(tMs) {
    var sec = Math.floor(tMs / 1000);
    var t = Math.floor(sec / _tfSec()) * _tfSec();
    var c = _cmap[t];
    if (!c) {
      c = { t: t, o: null, h: -Infinity, l: Infinity, c: null, vol: 0,
            levels: {}, poc: null, totB: 0, totS: 0 };
      _cmap[t] = c;
      _candles.push(c);
      _candles.sort(function (a, b) { return a.t - b.t; });
      if (_candles.length > MAX_CANDLES) { var drop = _candles.shift(); delete _cmap[drop.t]; }
    }
    return c;
  }

  function _ingest(price, qty, isBuyerMaker, tMs) {
    var c = _getCandle(tMs);
    if (c.o === null) c.o = price;
    c.c = price;
    if (price > c.h) c.h = price;
    if (price < c.l) c.l = price;
    c.vol += qty;
    var bk = _bucketOf(price);
    var lv = c.levels[bk];
    if (!lv) { lv = { b: 0, s: 0 }; c.levels[bk] = lv; }
    if (isBuyerMaker) { lv.s += qty; c.totS += qty; }
    else { lv.b += qty; c.totB += qty; }
    var _sd = isBuyerMaker ? -qty * price : qty * price;
    _cumulativeDelta += _sd;
    // -- session delta anchored to the US-session open (rolls daily at 09:30 ET) --
    var _anchor = _sessionAnchorMs();
    if (_anchor !== _sessionAnchorMsVal) {        // first ingest OR session rollover
      _sessionAnchorMsVal = _anchor;
      _sessionDelta = 0;                          // new session starts flat
      _sessionHigh = -Infinity; _sessionLow = Infinity;
    }
    if (tMs >= _anchor) {                          // only count current-session flow
      _sessionDelta += _sd;
      if (price > _sessionHigh) _sessionHigh = price;
      if (price < _sessionLow) _sessionLow = price;
    }
    _tickCount++;
    _dirty = true;
    if (!_seeding) _lastTickAt = Date.now();
  }

  function _finalizePOC(c) {
    if (c._ko) { c.poc = null; return; }   // skeleton (kline-only): no per-level POC
    var best = null, bestV = -1;
    for (var k in c.levels) {
      var tot = c.levels[k].b + c.levels[k].s;
      if (tot > bestV) { bestV = tot; best = +k; }
    }
    c.poc = best;
  }

  // -- CVD / OI ----------------------------------------------------------------
  var _KLINES = 'https://fapi.binance.com/fapi/v1/klines';
  var _OI_HIST = 'https://fapi.binance.com/futures/data/openInterestHist';
  var _OI_PERIOD = { '1m': '5m', '3m': '5m', '5m': '5m', '15m': '15m', '1h': '1h' };

  async function _fetchCVD(tf) {
    try {
      var url = _KLINES + '?symbol=' + SYMBOL + '&interval=' + tf + '&limit=1000';
      var j = await (await fetch(url)).json();
      if (!Array.isArray(j)) return;
      var arr = [];
      for (var i = 0; i < j.length; i++) {
        var qv = parseFloat(j[i][7]), tbq = parseFloat(j[i][10]);
        arr.push({ t: Math.floor(j[i][0] / 1000), delta: 2 * tbq - qv });
      }
      arr.sort(function (a, b) { return a.t - b.t; });
      _cvdDeltas = arr;
    } catch (e) { /* keep previous */ }
  }

  function _nearestCVDDelta(t) {
    var n = _cvdDeltas.length; if (!n) return 0;
    var lo = 0, hi = n - 1, best = 0;
    while (lo <= hi) { var mid = (lo + hi) >> 1;
      if (_cvdDeltas[mid].t <= t) { best = mid; lo = mid + 1; } else hi = mid - 1; }
    return _cvdDeltas[best].delta;
  }

  async function _fetchOI(tf) {
    try {
      var period = _OI_PERIOD[tf] || '5m';
      var url = _OI_HIST + '?symbol=' + SYMBOL + '&period=' + period + '&limit=500';
      var j = await (await fetch(url)).json();
      if (!Array.isArray(j)) return;
      _oiArr = j.map(function (d) {
        return { t: Math.floor(parseInt(d.timestamp, 10) / 1000), v: parseFloat(d.sumOpenInterest) };
      }).filter(function (d) { return d.v > 0; }).sort(function (a, b) { return a.t - b.t; });
    } catch (e) { /* keep previous */ }
  }

  function _oiAt(t) {
    if (!_oiArr.length) return null;
    var lo = 0, hi = _oiArr.length - 1, best = null;
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (_oiArr[mid].t <= t) { best = _oiArr[mid].v; lo = mid + 1; } else hi = mid - 1; }
    return best != null ? best : _oiArr[0].v;
  }

  // sample a {time,value}[] series (sorted asc) at time t -> last value with time <= t
  function _sampleByTime(arr, t) {
    if (!arr || !arr.length) return null;
    var lo = 0, hi = arr.length - 1, best = -1;
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (arr[mid].time <= t) { best = mid; lo = mid + 1; } else hi = mid - 1; }
    if (best < 0) best = 0;
    var v = arr[best].value;
    return (v == null || isNaN(v)) ? null : v;
  }

  async function _refetchSubs() {
    await _fetchCVD(_tf);
    await _fetchOI(_tf);
    _dirty = true;
  }

  // -- POLLING: fallback per aggiornare i dati anche se WS non funziona -------
  async function _pollRecentTrades() {
    if (_seeding || !_running || _wsAlive) return;   // only a gap-filler while the socket is down
    try {
      var url = REST_AGG + '?symbol=' + SYMBOL + '&limit=100';
      var r = await fetch(url);
      if (!r.ok) return;
      var j = await r.json();
      if (!Array.isArray(j) || !j.length) return;
      j.sort(function (a, b) { return a.a - b.a; });   // oldest -> newest by aggId
      var got = false;
      for (var i = 0; i < j.length; i++) {
        var t = j[i];
        if (t.a != null && t.a <= _lastAggId) continue;   // dedupe: skip already-ingested
        if (t.a != null) _lastAggId = t.a;
        _ingest(parseFloat(t.p), parseFloat(t.q), t.m, t.T);
        got = true;
      }
      if (got) _dirty = true;
    } catch (e) { /* ignore */ }
  }

  // -- seed (REST, newest -> back) : single-speed full order-flow pipeline -----
  // No kline OHLC skeleton. Every candle in view is reconstructed from real
  // aggTrades, so per-level footprint, POC and VRVP are valid across the whole
  // loaded range (not just a tiny detail window). Klines remain in use ONLY for
  // the separate CVD line series (_fetchCVD) - never for footprint cells.
  function _sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  async function _seed() {
    _seeding = true; _seedProg = 0; _status('order-flow sync\u2026');
    _sessionDelta = 0; _sessionAnchorMsVal = 0; _sessionHigh = -Infinity; _sessionLow = Infinity;

    var targetMs = (SEED_TARGET_HOURS[_tf] || 8) * 3600 * 1000;
    var cutoffTime = Date.now() - targetMs;
    var _seedOldestAggMs = null;   // oldest aggTrade actually ingested (session-gap boundary)

    // single paginated aggTrade pass, newest -> back, ingesting EVERY trade.
    try {
      var fromId = null, calls = 0, newestT = null, lastPaintAt = 0;
      while (calls < SEED_MAX_CALLS) {
        var url = REST_AGG + '?symbol=' + SYMBOL + '&limit=1000' + (fromId != null ? '&fromId=' + fromId : '');
        var r;
        try { r = await fetch(url); } catch (ne) { break; }
        if (r.status === 429 || r.status === 418) { await _sleep(1500); continue; } // backoff, retry same page
        if (!r.ok) break;
        var j = await r.json();
        if (!Array.isArray(j) || !j.length) break;
        j.sort(function (a, b) { return a.T - b.T; });
        if (newestT == null) newestT = j[j.length - 1].T;
        var oldestT = j[0].T;
        _seedOldestAggMs = oldestT;   // pages go back in time => last write = oldest
        // no detail-window cutoff: full per-level footprint across the whole span
        for (var i = 0; i < j.length; i++) {
          _ingest(parseFloat(j[i].p), parseFloat(j[i].q), j[i].m, j[i].T);
          if (j[i].a != null && j[i].a > _lastAggId) _lastAggId = j[i].a;
        }
        var firstId = j[0].a;
        fromId = (firstId != null) ? firstId - 1000 : null;
        calls++;
        var covered = newestT > oldestT ? (newestT - oldestT) / targetMs : 0;
        _seedProg = Math.max(_seedProg, Math.min(0.96, covered * 0.96));
        _status('order-flow ' + Math.round(_seedProg * 100) + '%');
        // progressive paint, throttled to ~12fps so the footprint visibly fills in
        var nowP = Date.now();
        if (nowP - lastPaintAt > 80) { _candles.forEach(_finalizePOC); _dirty = true; _draw(); lastPaintAt = nowP; }
        if (oldestT <= cutoffTime) break;            // history target reached
        if (fromId == null || fromId <= 0) break;     // start of available history
        await _sleep(120);                            // rate-limit courtesy (fapi weight budget)
      }
      _candles.forEach(_finalizePOC);
    } catch (e) { /* live will fill */ }

    // ---- skeleton backfill (high-TF structure) --------------------------------
    // Klines fill ONLY buckets older than the aggTrade reach, so 15m/1h show
    // candle structure instead of empty space. Flagged _ko => excluded from
    // POC/VRVP/big-flow; they never pass _ingest => session-delta stays pure
    // aggTrade. Never overwrites a real order-flow candle.
    try {
      var oldestReal = _candles.length ? _candles[0].t : Math.floor(Date.now() / 1000);
      var kurl = _KLINES + '?symbol=' + SYMBOL + '&interval=' + _tf + '&limit=500';
      var kr = await fetch(kurl);
      if (kr.ok) {
        var kj = await kr.json();
        if (Array.isArray(kj)) {
          for (var ki = 0; ki < kj.length; ki++) {
            var k = kj[ki], kb = Math.floor(k[0] / 1000);
            if (kb >= oldestReal) continue;     // don't shadow real order-flow candles
            if (_cmap[kb]) continue;            // already present
            var ck = _getCandle(k[0]);
            if (ck.o !== null) continue;        // safety: never overwrite filled candle

      var x = (d && d.data) ? d.data : d;

  // this every poll tick so the feed self-heals after a panel stop().

    _headless = true;
    _bucket = TF_BUCKET[_tf] || 10;

  // -- READ-ONLY SNAPSHOT (consumed by the KYO paper account) -----------------
  // Reconstructs the order-flow state from the footprint candles + CVD/OI series
  // and the session Value Area (window.SessionVP). Returns null until warm.
  // Directions use a deadband: 0 = flat (no signal), +1 = up, -1 = down.
  function getSnapshot() {
    var n = _candles.length;
    if (!n) return null;

    var tfSec = _tfSec();
    var nowSec = Math.floor(Date.now() / 1000);
    var curBucket = Math.floor(nowSec / tfSec) * tfSec;
    var last   = _candles[n - 1];
    // last CLOSED candle = the breakout-confirmation candle (body/delta)
    var closed = (last && last.t === curBucket && n >= 2) ? _candles[n - 2] : last;
    if (!closed || closed.o == null || closed.c == null) return null;

    var rng  = (closed.h - closed.l);
    var body = Math.abs(closed.c - closed.o);
    var bodyRatio = (rng > 0) ? (body / rng) : 0;
    var delta = (closed.totB || 0) - (closed.totS || 0);

    // live price = most recent close (forming candle if present)
    var price = (last && last.c != null) ? last.c : closed.c;

    // ---- CVD direction (cumulative delta slope, deadband) ----
    var cvdVal = 0, cvdDir = 0, cvdSlope = 0;
    var cn = _cvdDeltas.length;
    if (cn) {
      for (var i = 0; i < cn; i++) cvdVal += _cvdDeltas[i].delta; // cumulative CVD
      var K = Math.min(4, cn - 1);

        for (var j = cn - K; j < cn; j++) { back += _cvdDeltas[j].delta; absSum += Math.abs(_cvdDeltas[j].delta); }
        cvdSlope = back; // net signed flow over last K candles
        var cvdBand = 0.15 * (absSum / K) * K; // deadband ~ noise floor
        if (back > cvdBand) cvdDir = 1; else if (back < -cvdBand) cvdDir = -1; else cvdDir = 0;
      }
    }

    // ---- OI direction (slope over last samples, 0.15% deadband) ----
    var oiVal = null, oiDir = 0, oiSlope = 0;
    var on = _oiArr.length;
    if (on) {
      oiVal = _oiArr[on - 1].v;
      var OK = Math.min(3, on - 1);
      if (OK >= 1) {
        var oiBack = _oiArr[on - 1 - OK].v;
        oiSlope = oiVal - oiBack;
        var oiBand = 0.0015 * Math.abs(oiVal); // 0.15% of OI = flat
        if (oiSlope > oiBand) oiDir = 1; else if (oiSlope < -oiBand) oiDir = -1; else oiDir = 0;
      }
    }

    // ---- Value Area (US-session profile) ----
    var svp = (typeof window !== 'undefined') ? window.SessionVP : null;
    var vah = svp && svp.vah ? svp.vah : null;
    var val = svp && svp.val ? svp.val : null;
    var vpoc = svp && svp.vpoc ? svp.vpoc : null;
    var inVA = (vah && val && price != null) ? (price >= val && price <= vah) : null;

    return {
      ts: _lastTickAt || (closed.t * 1000),
      tf: _tf,
      price: price,
      vah: vah, val: val, vpoc: vpoc, inValueArea: inVA,
      sessionDelta: _sessionDelta, cumulativeDelta: _cumulativeDelta,
      sessionHigh: isFinite(_sessionHigh) ? _sessionHigh : null,
      sessionLow: isFinite(_sessionLow) ? _sessionLow : null,
      candle: { t: closed.t, o: closed.o, h: closed.h, l: closed.l, c: closed.c,
                delta: delta, bodyRatio: bodyRatio, poc: closed.poc },
      cvd: { value: cvdVal, slope: cvdSlope, dir: cvdDir },
      oi:  { value: oiVal,  slope: oiSlope,  dir: oiDir }
    };
  }

  return {
    start: start, stop: stop, toggle: toggle, isOpen: isOpen,
    open: open, close: close, refresh: refresh, mount: mount, setTF: setTF,
    ensureFeed: ensureFeed, getSnapshot: getSnapshot,
    get tf() { return _tf; }
  };

<!-- serving this page over http://localhost (Live Server), NOT file://.        -->
<!-- bitget-executor.js inlined verbatim so the standalone page has NO external
     JS dependency to 404 when opened from any folder / via file://. Live trading
     still requires `node local-bitget-proxy.js` and serving over http://localhost. -->
<script>
window.BitgetExecutor = (function() {
  'use strict';

  const MAX_SIZE_BTC = 0.1;
  const MIN_SIZE_BTC = 0.0001;
  const MAX_RETRIES  = 3;
  const RETRY_DELAY  = 1000;
  // Rate-limit windows: opens are spaced more conservatively, closes are risk-reducing
  // and must not be blocked by the same window that just placed the entry.
  const OPEN_RL_MS   = 500;
  const CLOSE_RL_MS  = 100;
  // Bitget V2 error codes considered SAFE TO RETRY for placeOrder
  // (server confirms the request did NOT execute):
  //   40007  internal/timeout (Bitget) — pre-execution
  //   50001  server error — pre-execution
  //   45110  not enough margin (transient if margin moves) — let retry
  // Codes NOT in this set never retry placeOrder (avoids duplicate fills).
  const SAFE_RETRY_CODES = { '40007': 1, '50001': 1 };

  const _state = {
    lastOrderTime: 0,
    orderCount: 0,
    errors: [],
    connected: false,
    // Mutual-exclusion lock for the OPEN path (setLeverage x2 + placeOrder + post-fill
    // TPSL spans >1s). Prevents two concurrent opens from both clearing the rate-limit
    // gate and placing duplicate positions. Closes never set/observe this flag.
    openInFlight: false,
    // Leverage cache per holdSide — Bitget rejects redundant set-leverage with
    // open positions in some modes; caching prevents API churn and false errors.
    levCache: { long: 0, short: 0 },
    // IP block circuit breaker: set when Bitget rejects with "Invalid IP".
    // All outbound calls are short-circuited until clearIpBlock() is called.
    ipBlocked: false,
    ipBlockTs: 0,
    // Read-confirmation flag: true ONLY after a getAllPositions() call that
    // actually succeeded. A failed read (HTTP 500 / network / IP-not-yet-blocked)
    // returns [] which is INDISTINGUISHABLE from a genuinely flat exchange.
    // Consumers (control-panel SYNC watchdog) must require this === true before
    // treating an empty positions array as "exchange is flat", otherwise a
    // transient read failure force-closes a live paper leg while the real
    // Bitget position stays open → paper/live desync. Default false = unconfirmed.
    lastPositionsOk: false
  };

  // Idempotency key generator (32-char client order id).
  // Bitget V2 honours clientOid: same clientOid is treated as the same order.
  function _newClientOid() {
    return 'otm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }

  // Open/close position sound — LIVE BITGET ONLY (paper accounts are silent).
  // Same preset previously used by the paper engine: MP3 files, volume 0.7.
  function _playLiveSound(kind) {
    try {
      var src = (kind === 'close') ? 'files/close_pos.mp3' : 'files/open_pos.mp3';
      var a = new Audio(src);
      a.volume = 0.7;
      a.play().catch(function() {});
    } catch (e) {}
  }

  async function _apiCall(action, params, retryCount = 0) {
    // Risk-reducing actions (close / cancel) must NEVER be short-circuited by the IP
    // breaker: blocking them can leave a live position open with no way to flatten it
    // from the app once the breaker is OPEN. They are allowed through; if the IP is truly
    // bad Bitget rejects them anyway, and if the IP was fixed a successful call auto-clears
    // the breaker below.
    const _riskReducing = (action === 'closeAllPositions')
      || (action === 'closePosition')
      || (action === 'cancelOrder')
      || (action === 'cancelPlanOrder')
      || (action === 'placeOrder' && /^close_/.test((params && params.side) || ''));
    // IP block circuit breaker: if Bitget has previously rejected with "Invalid IP",
    // short-circuit immediately to prevent API spam until manually cleared.
    if (_state.ipBlocked && !_riskReducing) {
      return { success: false, error: 'IP not whitelisted on Bitget — live trading suspended', code: 'IP_BLOCKED' };
    }
    // Idempotency-sensitive actions: a network exception MUST NOT trigger blind retry,
    // because the exchange may have already executed the request (just the response is lost).
    const _idempSensitive = (action === 'placeOrder');
    try {
      const isLocalhost = window.location.hostname === 'localhost' ||
                          window.location.hostname === '127.0.0.1' ||
                          window.location.hostname.startsWith('192.168.') ||
                          window.location.hostname.endsWith('.local');
      const endpoint = isLocalhost
        ? 'http://localhost:3333/bitget-trading'
        : '/.netlify/functions/bitget-trading';
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, params })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (data.code === '00000') {
        _state.connected = true;
        // Auto-heal: a successful response proves the IP whitelist is now good. With the
        // breaker OPEN only risk-reducing calls reach here, so a successful close/cancel
        // self-clears the breaker and restores normal trading without a manual call.
        if (_state.ipBlocked) {
          _state.ipBlocked = false;
          _state.ipBlockTs = 0;
          console.log('[BitgetExecutor] IP block auto-cleared after a successful API call.');
        }
        return { success: true, data: data.data };
      } else {
        _state.errors.push({ time: Date.now(), msg: data.msg, code: data.code });
        if (_state.errors.length > 100) _state.errors.splice(0, _state.errors.length - 100);
        // IP whitelist rejection: permanent until operator fixes — circuit-break immediately.
        if (data.msg && data.msg.indexOf('Invalid IP') !== -1) {
          _state.ipBlocked = true;
          _state.ipBlockTs = Date.now();
          _state.connected = false;
          console.error('[BitgetExecutor] IP not whitelisted — circuit breaker OPEN. Call clearIpBlock() after fixing API key IP whitelist.');
          return { success: false, error: data.msg, code: 'IP_BLOCKED' };
        }
        // Retry only on Bitget-confirmed pre-execution failures (safe codes).
        // For placeOrder we additionally rely on clientOid to make any retry idempotent.
        if (retryCount < MAX_RETRIES && SAFE_RETRY_CODES[String(data.code)]) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * (retryCount + 1)));
          return _apiCall(action, params, retryCount + 1);
        }
        return { success: false, error: data.msg, code: data.code };
      }
    } catch (error) {
      _state.connected = false;
      _state.errors.push({ time: Date.now(), msg: error.message });
      if (_state.errors.length > 100) _state.errors.splice(0, _state.errors.length - 100);
      // CRITICAL: never blind-retry placeOrder on network exception.
      // The order may have been accepted server-side; only the response was lost.
      // clientOid would dedupe BUT we still avoid the round-trip; caller can re-send
      // explicitly with the same clientOid if desired.
      if (_idempSensitive) {
        return { success: false, error: error.message, code: 'NETWORK' };
      }
      if (retryCount < MAX_RETRIES) {
        await new Promise(r => setTimeout(r, RETRY_DELAY * (retryCount + 1)));
        return _apiCall(action, params, retryCount + 1);
      }
      return { success: false, error: error.message };
    }
  }

  // Bitget V2: leverage via dedicated endpoint (not in place-order body).
  // Cached per holdSide — skip redundant calls (the API rejects modify-with-open-position
  // in some configurations, and unnecessary calls add ~150-300ms latency to entries).
  async function setLeverage(leverage, holdSide) {
    const lev = Math.min(125, Math.max(1, parseInt(leverage) || 1));
    const _side = (holdSide === 'short') ? 'short' : 'long';
    if (_state.levCache[_side] === lev) {
      return { success: true, cached: true, data: { leverage: lev, holdSide: _side } };
    }
    const r = await _apiCall('setLeverage', { symbol: 'BTCUSDT', leverage: lev, holdSide: _side });
    if (r.success) {
      _state.levCache[_side] = lev;
    } else {
      console.warn('[BitgetExecutor] setLeverage', _side, 'failed:', r.error);
    }
    return r;
  }

  // Force-invalidate the leverage cache (e.g., after a manual change in Bitget UI
  // or after a session-level reset). Public so external callers can resync.
  function resetLeverageCache() {
    _state.levCache.long = 0;
    _state.levCache.short = 0;
  }

  // Clear the IP block circuit breaker after fixing the API key IP whitelist on Bitget.
  function clearIpBlock() {
    _state.ipBlocked = false;
    _state.ipBlockTs = 0;
    console.log('[BitgetExecutor] IP block cleared — resuming API calls.');
  }

  // Flash-close ALL open positions at market — atomic, no size calc needed.
  // Optional holdSide: 'long' | 'short' — restricts to one side in hedge mode.
  async function closeAllPositions(holdSide) {
    const _params = { symbol: 'BTCUSDT' };
    if (holdSide === 'long' || holdSide === 'short') _params.holdSide = holdSide;
    const result = await _apiCall('closeAllPositions', _params);
    if (result.success) {
      window._bitgetManualCloseTs = Date.now();  // 60s cooldown blocks auto-trading
      _playLiveSound('close');
      if (window.BitgetControlPanel && window.BitgetControlPanel.playSound) window.BitgetControlPanel.playSound('close');
      console.log('[BitgetExecutor] closeAllPositions OK', holdSide ? '('+holdSide+')' : '(all)');
    } else {
      console.error('[BitgetExecutor] closeAllPositions failed:', result.error);
    }
    return result;
  }

  async function placeOrder(signal) {
    if (!signal.side || !signal.size || signal.size <= 0) {
      console.error('[BitgetExecutor] Invalid signal:', signal);
      return { success: false, error: 'Invalid signal parameters' };
    }
    const _isClose = signal.side === 'close_long' || signal.side === 'close_short';
    const _rawSize = parseFloat(signal.size);
    if (isNaN(_rawSize) || _rawSize <= 0) return { success: false, error: 'Invalid size value' };
    let safeSize = _rawSize;
    // OPEN: hard ceiling — REJECT oversize instead of silently clamping. A silent down-clamp
    // would open a fraction of the intended size while SL/TP and R:R are computed on the full
    // size elsewhere, desyncing live risk from the paper book. Closes are NEVER capped (must
    // be able to flatten any open size).
    if (!_isClose) {
      if (safeSize > MAX_SIZE_BTC) {
        console.error('[BitgetExecutor] Size ' + safeSize.toFixed(6) + ' BTC exceeds MAX ' + MAX_SIZE_BTC + ' BTC \u2014 order REJECTED (no silent clamp).');
        return { success: false, error: 'Size ' + safeSize.toFixed(6) + ' BTC exceeds max ' + MAX_SIZE_BTC + ' BTC', code: 'SIZE_EXCEEDED' };
      }
      if (safeSize < MIN_SIZE_BTC) {
        // Clamp UP to the Bitget minimum (~$10 notional floor) — harmless (raises to the
        // exchange floor), unlike clamping DOWN which silently shrinks intent.
        console.warn('[BitgetExecutor] Size ' + safeSize.toFixed(6) + ' BTC below minimum \u2014 clamped to ' + MIN_SIZE_BTC + ' BTC (~$10 floor)');
        safeSize = MIN_SIZE_BTC;
      }
    }

    const now = Date.now();
    // Closes use a relaxed window — risk reduction must not be blocked by an entry RL.
    const _rlWindow = _isClose ? CLOSE_RL_MS : OPEN_RL_MS;
    if (now - _state.lastOrderTime < _rlWindow) {
      console.warn('[BitgetExecutor] Rate limit (' + (_isClose ? 'close' : 'open') + '): order too soon');
      return { success: false, error: 'Rate limit exceeded' };
    }

    // CONCURRENCY GUARD (open path only): the open sequence spans setLeverage x2 +
    // placeOrder + post-fill TPSL (>1s). Without an in-flight lock a second open
    // arriving inside that window passes the rate-limit gate (lastOrderTime not yet
    // committed by the first) and places a DUPLICATE position — each open mints a fresh
    // clientOid so the exchange does NOT dedupe. Closes are risk-reducing: never blocked.
    if (!_isClose) {
      if (_state.openInFlight) {
        console.warn('[BitgetExecutor] Open already in-flight \u2014 duplicate open suppressed');
        return { success: false, error: 'Open order already in-flight' };
      }
      _state.openInFlight = true;
    }
    // Reserve the rate-limit window SYNCHRONOUSLY (pre-await). A concurrent placeOrder in
    // the same tick now reads the updated lastOrderTime and is throttled before the
    // network round-trip, closing the check->commit TOCTOU that enabled double-submits.
    _state.lastOrderTime = now;

    try {
    const leverage = (signal.leverage && signal.leverage > 0) ? Math.min(125, Math.max(1, parseInt(signal.leverage))) : 1;
    console.log('[BitgetExecutor] Placing order:', { side: signal.side, size: safeSize, leverage });

    if (!_isClose) {
      // Set leverage on both sides (hedge-mode safe). Cache prevents redundant calls.
      // Failures are non-blocking: ordering proceeds with last-known leverage on Bitget.
      await setLeverage(leverage, 'long');
      await setLeverage(leverage, 'short');
    }

    // Idempotency: every placeOrder gets a fresh clientOid unless caller provided one.
    // If a network exception loses the response, callers may resend with the same
    // clientOid to dedupe at the exchange — Bitget V2 returns the original order.
    const _clientOid = signal.clientOid || _newClientOid();

    const _orderParams = {
      symbol: 'BTCUSDT',
      side: signal.side,
      size: safeSize,
      orderType: signal.orderType || 'market',
      clientOid: _clientOid
    };
    if (signal.orderType === 'limit' && signal.price) _orderParams.price = signal.price;
    // Exchange-native SL/TP — captured here, NOT injected into the order body.
    // Rationale: presetStopLossPrice/presetTakeProfitPrice in V2 placeOrder create an
    // ORDER-ATTACHED (partial) TPSL plan tied to the order quantity ("TP/SL parziale"
    // in the Bitget UI). Subsequent updatePositionSL/TP calls (which our entry flow
    // already issues post-fill) place a POSITION-LEVEL (complete) TPSL via
    // placeTpslOrder/pos_loss/pos_profit ("TP/SL completo"). Both coexist on the
    // exchange — duplicate trigger surface, ambiguous trail-stop interactions,
    // and visual noise on the position panel. We unify on the position-level path:
    // strip the presets from the order body, then upsert pos_loss/pos_profit
    // explicitly after the fill. The upsert logic in updatePositionSL/TP is
    // idempotent (modify-or-place), so any caller that ALSO issues post-entry
    // updates remains safe — they simply modify the plan order we just placed.
    // BTCUSDT tick size = 0.1 USDT: round to 1 decimal.
    const _presetSL = signal.presetStopLossPrice   ? parseFloat(signal.presetStopLossPrice)   : 0;
    const _presetTP = signal.presetTakeProfitPrice ? parseFloat(signal.presetTakeProfitPrice) : 0;

    const result = await _apiCall('placeOrder', _orderParams);
    if (result.success) {
      _state.lastOrderTime = now;
      _state.orderCount++;
      // Surface clientOid on the result so callers can persist it for reconciliation
      if (result.data && !result.data.clientOid) {
        try { result.data.clientOid = _clientOid; } catch(_e) {}
      }
      console.log('[BitgetExecutor] Order placed:', result.data);
      // LIVE-ONLY sound: 'close' for close_long/close_short, 'open' otherwise.
      _playLiveSound(_isClose ? 'close' : 'open');

      // Post-fill: install POSITION-LEVEL plan orders ONLY (no partial TPSL).
      // Skipped for closes (they have no SL/TP context) and when no preset was supplied.
      if (!_isClose && (_presetSL > 0 || _presetTP > 0)) {
        const _holdSide = (signal.side === 'open_long') ? 'long'
                        : (signal.side === 'open_short') ? 'short'
                        : null;
        if (_holdSide) {
          // SL is a hard risk control. Retry; if it cannot be installed, EMERGENCY
          // FLAT-CLOSE the just-opened position rather than hold it naked, and return
          // failure so callers do not record a phantom protected position. (closeAllPositions
          // is risk-reducing → bypasses the IP breaker.)
          if (_presetSL > 0) {
            let _slOk = false, _slErr = null;
            for (let _a = 0; _a < 2 && !_slOk; _a++) {
              try {
                const _rSL = await updatePositionSL(_holdSide, _presetSL);
                if (_rSL && _rSL.success) { _slOk = true; break; }
                _slErr = (_rSL && _rSL.error) || 'unknown';
              } catch (_eSL) {
                _slErr = (_eSL && _eSL.message) || 'exception';
              }
              if (!_slOk && _a === 0) await new Promise(r => setTimeout(r, 400));
            }
            if (!_slOk) {
              console.error('[BitgetExecutor] Post-fill SL FAILED after retries (' + _slErr +
                ') — EMERGENCY flat-close to avoid a naked position.');
              let _flatOk = false;
              try {
                const _flat = await closeAllPositions(_holdSide);
                _flatOk = !!(_flat && _flat.success);
              } catch (_eFlat) {
                console.error('[BitgetExecutor] Emergency flat-close threw:', _eFlat && _eFlat.message);
              }
              result.success = false;
              result.slInstallFailed = true;
              result.flatClosed = _flatOk;
              result.error = 'SL install failed; position ' + (_flatOk ? 'flat-closed (no naked exposure)' :
                'COULD NOT be flat-closed — MANUAL INTERVENTION REQUIRED') + ': ' + _slErr;
              return result;
            }
          }
          // TP is not a naked-risk control: retry once, warn on persistent failure.
          if (_presetTP > 0) {
            try {
              let _rTP = await updatePositionTP(_holdSide, _presetTP);
              if (!_rTP || !_rTP.success) {
                await new Promise(r => setTimeout(r, 400));
                _rTP = await updatePositionTP(_holdSide, _presetTP);
                if (!_rTP || !_rTP.success) {
                  console.warn('[BitgetExecutor] Post-fill TP plan failed after retry:', _rTP && _rTP.error);
                }
              }
            } catch (_eTP) {
              console.warn('[BitgetExecutor] Post-fill TP error:', _eTP && _eTP.message);
            }
          }
        }
      }
    } else {
      if (window.BitgetControlPanel && window.BitgetControlPanel.playSound) window.BitgetControlPanel.playSound('error');
      console.error('[BitgetExecutor] Order failed:', result.error, '| clientOid:', _clientOid);
    }
    return result;
    } finally {
      if (!_isClose) _state.openInFlight = false;
    }
  }

  // Locate the orderId of an existing TPSL plan order on the open position by planType+side.
  // Used by updatePositionSL/TP to decide whether to MODIFY in-place (atomic replace) or
  // PLACE a new plan order. Returns null if none found or on API failure.
  // NOTE: orders-plan-pending response uses 'posSide' (not 'holdSide') for direction.
  async function _findExistingTpsl(planType, holdSide) {
    const r = await _apiCall('getTpslOrders', { symbol: 'BTCUSDT' });
    if (!r.success) return null;
    const d = r.data;
    const arr = (d && Array.isArray(d.entrustedList)) ? d.entrustedList
              : (Array.isArray(d) ? d : (d ? [d] : []));
    const _hs = String(holdSide || '').toLowerCase();
    const _pt = String(planType || '').toLowerCase();
    for (let i = 0; i < arr.length; i++) {
      const ord = arr[i] || {};
      const ordPt = String(ord.planType || '').toLowerCase();
      if (ordPt !== _pt) continue;
      const ordHs = String((ord.holdSide || ord.posSide) || '').toLowerCase();
      if (ordHs && ordHs !== _hs) continue;
      if (ord.orderId) {
        // size carried by the plan order itself (already accepted by the exchange on
        // place). Bitget modify-tpsl-order rejects with 400172 if 'size' is empty, so we
        // surface it here and let updatePositionSL/TP forward it into the MODIFY call.
        const _sz = ord.size != null ? ord.size : (ord.delegateValue != null ? ord.delegateValue : null);
        return { orderId: String(ord.orderId), size: (_sz != null ? String(_sz) : null) };
      }
    }
    return null;
  }

  // Back-compat thin wrapper: callers that only need the id (deletePositionSL/TP).
  async function _findExistingTpslOrderId(planType, holdSide) {
    const f = await _findExistingTpsl(planType, holdSide);
    return f ? f.orderId : null;
  }

  // Resolve the contract quantity of the current open position on a given side.
  // Used as a fallback size for modify-tpsl-order when the plan order itself
  // doesn't echo back a usable 'size'. holdSide: 'long' | 'short'.
  async function _resolvePositionSize(holdSide) {
    try {
      const _side = String(holdSide || '').toLowerCase();
      const positions = await getAllPositions();
      const match = (positions || []).find(p =>
        String(p.holdSide || p.posSide || '').toLowerCase() === _side
      ) || (positions || [])[0];
      if (match) {
        const _sz = match.total != null ? match.total : match.size;
        if (_sz != null && parseFloat(_sz) > 0) return String(_sz);
      }
    } catch (e) { /* fall through to null */ }
    return null;
  }

  // Bitget V2 atomic replace of an existing TPSL plan order's triggerPrice.
  // Required so SL/TP updates don't stack duplicate plan orders on the same side.
  async function modifyTpslOrder(orderId, triggerPrice, opts) {
    if (!orderId)                             return { success: false, error: 'Missing orderId' };
    if (!triggerPrice || triggerPrice <= 0)   return { success: false, error: 'Invalid triggerPrice' };
    const _params = {
      symbol:       'BTCUSDT',
      orderId:      String(orderId),
      triggerPrice: parseFloat(triggerPrice).toFixed(1),
      triggerType:  (opts && opts.triggerType) || 'mark_price'
    };
    if (opts && opts.size) _params.size = String(opts.size);
    const r = await _apiCall('modifyTpslOrder', _params);
    if (!r.success) console.warn('[BitgetExecutor] modifyTpslOrder failed:', r.error, r.code);
    return r;
  }

  // Update the stop-loss of an existing open position at exchange level.
  // Upsert semantics: MODIFY existing pos_loss plan order if present (atomic replace),
  // otherwise PLACE a new one. This prevents the chart-drag scenario where each drag
  // commit was creating a fresh pos_loss order alongside the original — both would fire,
  // closing the position at the wrong level and leaving the chart UI showing the OLD
  // trigger price (the next poll always picked the FIRST returned plan order, ignoring
  // the freshly-placed one). holdSide: 'long' | 'short'
  async function updatePositionSL(holdSide, slPrice) {
    if (!slPrice || slPrice <= 0) return { success: false, error: 'Invalid SL price' };
    const _side = (typeof holdSide === 'string') ? holdSide.toLowerCase() : 'long';
    const _existing = await _findExistingTpsl('pos_loss', _side);
    let r;
    if (_existing && _existing.orderId) {
      // modify-tpsl-order requires a non-empty 'size' (400172). Prefer the plan order's
      // own size; fall back to the live position contract qty.
      const _sz = _existing.size || await _resolvePositionSize(_side);
      r = await modifyTpslOrder(_existing.orderId, slPrice, _sz ? { size: _sz } : undefined);
      // Fall through to place-tpsl-order if modify rejects (e.g. order already triggered).
      if (r && r.success) return r;
      console.warn('[BitgetExecutor] updatePositionSL modify failed, falling back to place:', r && r.error);
    }
    r = await _apiCall('placeTpslOrder', {
      symbol:       'BTCUSDT',
      planType:     'pos_loss',
      triggerPrice: parseFloat(slPrice).toFixed(1),
      triggerType:  'mark_price',
      holdSide:     _side
    });
    if (!r.success) console.warn('[BitgetExecutor] updatePositionSL failed:', r.error, r.code);
    return r;
  }

  // Update the take-profit of an existing open position at exchange level.
  // Upsert semantics: MODIFY existing pos_profit plan order if present, else PLACE new.
  async function updatePositionTP(holdSide, tpPrice) {
    if (!tpPrice || tpPrice <= 0) return { success: false, error: 'Invalid TP price' };
    const _side = (typeof holdSide === 'string') ? holdSide.toLowerCase() : 'long';
    const _existing = await _findExistingTpsl('pos_profit', _side);
    let r;
    if (_existing && _existing.orderId) {
      const _sz = _existing.size || await _resolvePositionSize(_side);
      r = await modifyTpslOrder(_existing.orderId, tpPrice, _sz ? { size: _sz } : undefined);
      if (r && r.success) return r;
      console.warn('[BitgetExecutor] updatePositionTP modify failed, falling back to place:', r && r.error);
    }
    r = await _apiCall('placeTpslOrder', {
      symbol:       'BTCUSDT',
      planType:     'pos_profit',
      triggerPrice: parseFloat(tpPrice).toFixed(1),
      triggerType:  'mark_price',
      holdSide:     _side
    });
    if (!r.success) console.warn('[BitgetExecutor] updatePositionTP failed:', r.error, r.code);
    return r;
  }

  // Cancel an existing TPSL plan order on Bitget by orderId.
  // Wraps the V2 cancel-plan-order endpoint. Used by deletePositionSL/TP and
  // by any caller that needs to drop a plan order without replacing it.
  // planType: 'pos_loss' | 'pos_profit' | 'profit_loss' (both)
  async function cancelPlanOrder(orderId, planType) {
    if (!orderId) return { success: false, error: 'Missing orderId' };
    const r = await _apiCall('cancelPlanOrder', {
      symbol:   'BTCUSDT',
      orderId:  String(orderId),
      planType: planType || 'profit_loss'
    });
    if (!r.success) console.warn('[BitgetExecutor] cancelPlanOrder failed:', r.error, r.code);
    return r;
  }

  // Delete the stop-loss plan order on an existing open position.
  // Looks up the active pos_loss orderId for the holdSide via getTpslOrders,
  // then issues a cancel. Idempotent: if no SL plan order exists, returns
  // success with a no-op message (chart can drop the line either way).
  async function deletePositionSL(holdSide) {
    const _side = (typeof holdSide === 'string') ? holdSide.toLowerCase() : 'long';
    const _id   = await _findExistingTpslOrderId('pos_loss', _side);
    if (!_id) return { success: true, msg: 'No SL plan order on ' + _side + ' to cancel' };
    return cancelPlanOrder(_id, 'pos_loss');
  }

  // Delete the take-profit plan order on an existing open position.
  // Same idempotent semantics as deletePositionSL.
  async function deletePositionTP(holdSide) {
    const _side = (typeof holdSide === 'string') ? holdSide.toLowerCase() : 'long';
    const _id   = await _findExistingTpslOrderId('pos_profit', _side);
    if (!_id) return { success: true, msg: 'No TP plan order on ' + _side + ' to cancel' };
    return cancelPlanOrder(_id, 'pos_profit');
  }

  // Place a trailing (moving) stop on an existing open position.
  // callbackRatio: decimal string, e.g. "0.01" = 1% callback drawdown from the peak price.
  // activationPrice: mark price at which the trailing stop begins tracking.
  //   Pass current market price for immediate activation.
  //   Omit (null/undefined) to let Bitget activate from the current mark price server-side.
  async function setTrailingStop(holdSide, callbackRatio, activationPrice, size) {
    const _ratio = parseFloat(callbackRatio);
    if (!_ratio || _ratio <= 0 || _ratio > 1) {
      return { success: false, error: 'callbackRatio must be a decimal 0 < r <= 1 (e.g. 0.01 for 1%)' };
    }
    const _side = (typeof holdSide === 'string') ? holdSide.toLowerCase() : 'long';
    const _params = {
      symbol:        'BTCUSDT',
      planType:      'moving_plan',
      callbackRatio: _ratio.toFixed(4),
      triggerType:   'mark_price',
      holdSide:      _side
    };
    if (activationPrice && parseFloat(activationPrice) > 0) {
      _params.triggerPrice = parseFloat(activationPrice).toFixed(2);
    }
    // size (BTC) is required by Bitget moving_plan — always pass full position size
    if (size && parseFloat(size) > 0) {
      _params.size = parseFloat(size).toFixed(6);
    }
    const r = await _apiCall('placeTpslOrder', _params);
    if (!r.success) console.warn('[BitgetExecutor] setTrailingStop failed:', r.error, r.code);
    return r;
  }

  async function getPosition() {
    const result = await _apiCall('getPosition', { symbol: 'BTCUSDT' });
    if (!result.success) return null;
    const d = result.data;
    // V2 returns array; extract first active position
    return Array.isArray(d) ? (d[0] || null) : d;
  }

  // Returns ALL active positions (hedge mode: long + short simultaneously).
  // Uses /all-position endpoint — single-position only returns one side.
  async function getAllPositions() {
    const result = await _apiCall('getAllPositions', { symbol: 'BTCUSDT' });
    if (!result.success) { _state.lastPositionsOk = false; return []; }
    _state.lastPositionsOk = true;
    const d = result.data;
    const arr = Array.isArray(d) ? d : (d ? [d] : []);
    return arr.filter(p => parseFloat(p.total || 0) !== 0);
  }

  async function closePosition(side, size) {
    const _s = (typeof side === 'string') ? side.toLowerCase() : '';
    return await placeOrder({ side: _s === 'long' ? 'close_long' : 'close_short', size, orderType: 'market' });
  }

  async function getAccountAssets() {
    const result = await _apiCall('getAccountAssets', {});
    if (!result.success) {
      // Log raw failure once per session for diagnosis — suppressed after first occurrence.
      if (!_state._acctErrLogged) {
        _state._acctErrLogged = true;
        console.warn('[BitgetExecutor] getAccountAssets failed (code:', result.code, '| error:', result.error, ')');
      }
      return null;
    }
    if (result.data == null) {
      // API returned 00000 but data is null/undefined — account may have no USDT-M margin.
      if (!_state._acctNullLogged) {
        _state._acctNullLogged = true;
        console.warn('[BitgetExecutor] getAccountAssets: success but data=null (no USDT-M account or empty margin)');
      }
      return null;
    }
    _state._acctErrLogged = false;
    _state._acctNullLogged = false;
    return result.data;
  }

  // Fetch all pending position-level TPSL plan orders (pos_loss + pos_profit).
  // Used by the control panel to show real SL/TP prices set on existing positions.
  async function getTpslOrders() {
    const result = await _apiCall('getTpslOrders', { symbol: 'BTCUSDT' });
    if (!result.success) return [];
    const d = result.data;
    // Bitget V2 wraps orders in { entrustedList: [...], endId: "..." }
    if (d && Array.isArray(d.entrustedList)) return d.entrustedList;
    return Array.isArray(d) ? d : (d ? [d] : []);
  }

  async function getOpenOrders() {
    const result = await _apiCall('getOpenOrders', { symbol: 'BTCUSDT' });
    return result.success ? result.data : [];
  }

  // Financial records (bills): realized close PnL + trading fees + funding (contract_settle_fee).
  // Returns the raw bills array; the caller nets Σ(amount + fee) over the desired window.
  async function getAccountBill(opts) {
    const _p = { symbol: 'BTCUSDT' };
    if (opts && opts.startTime) _p.startTime = opts.startTime;
    if (opts && opts.endTime)   _p.endTime   = opts.endTime;
    const result = await _apiCall('getAccountBill', _p);
    if (!result.success) return [];
    const d = result.data;
    if (d && Array.isArray(d.bills)) return d.bills;
    return Array.isArray(d) ? d : (d ? [d] : []);
  }

  async function cancelOrder(orderId) {
    return await _apiCall('cancelOrder', { symbol: 'BTCUSDT', orderId });
  }

  function getState() {
    return {
      connected: _state.connected,
      orderCount: _state.orderCount,
      lastOrderTime: _state.lastOrderTime,
      errors: _state.errors.slice(-10),
      levCache: { long: _state.levCache.long, short: _state.levCache.short },
      ipBlocked: _state.ipBlocked,
      ipBlockTs: _state.ipBlockTs,
      openInFlight: _state.openInFlight,
      lastPositionsOk: _state.lastPositionsOk
    };
  }

  return { placeOrder, getPosition, getAllPositions, closePosition, closeAllPositions, getAccountAssets, getOpenOrders, getAccountBill, getTpslOrders, cancelOrder, setLeverage, resetLeverageCache, clearIpBlock, updatePositionSL, updatePositionTP, modifyTpslOrder, cancelPlanOrder, deletePositionSL, deletePositionTP, setTrailingStop, getState };
})();

</script>
<script src="session-volume-profile.js"></script>
<script>
(function _standaloneBitgetWiring() {
  // session-volume-profile.js auto-starts -> window.SessionVP (sVAH/sVPOC/sVAL).
  // Here we only add the live-position bridge -> window.BCWPositions, mirroring
  // bitget-chart-widget.js _pollPositions (the exact shape the footprint overlay
  // and SL/TP drag-to-modify already consume). Skipped if the real chart widget
  // is present, since the dashboard already owns BCWPositions.
  if (window.BitgetChartWidget) return;

  // ── Live Bitget V2 price feed (standalone) ───────────────────────────────────
  // In the dashboard, bitget-chart-widget.js publishes window._cachedBtcPrice from the
  // Bitget V2 public WS (USDT-FUTURES last price). The standalone page does NOT load
  // that widget, so the trade panel (_place / equity marginUsed) had no market price and
  // aborted with "Prezzo di mercato non disponibile". Here we replicate the EXACT same
  // Bitget source so the order-execution panel is wired to live Bitget identically to the
  // dashboard FP. Uses window.setBtcPrice when present (priority arbitration), else writes
  // the plain number — same fallback contract as the chart widget.
  (function _standaloneBitgetPrice() {
    var BITGET_WS_PUBLIC    = 'wss://ws.bitget.com/v2/ws/public';
    var BITGET_REST_TICKER  = 'https://api.bitget.com/api/v2/mix/market/ticker';
    var BITGET_SYMBOL       = 'BTCUSDT';
    var BITGET_PRODUCT_TYPE = 'USDT-FUTURES';
    var _pws = null, _pPing = null, _pRetry = null, _pRetryCount = 0;

    function _publish(v) {
      v = parseFloat(v);
      if (!(v > 0)) return;
      if (window.setBtcPrice) window.setBtcPrice(v, 'bcw');
      else window._cachedBtcPrice = v;
      window.currentPrice = v;
    }

    // Immediate REST seed so the panel has a price before the WS opens.
    (function _seed() {
      try {
        fetch(BITGET_REST_TICKER + '?symbol=' + BITGET_SYMBOL + '&productType=' + BITGET_PRODUCT_TYPE)
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var row = (j && j.data && (Array.isArray(j.data) ? j.data[0] : j.data)) || null;
            if (row) _publish(row.lastPr || row.markPrice || row.indexPrice);
          }).catch(function () {});
      } catch (e) {}
    })();

    function _connect() {
      if (_pRetry) { clearTimeout(_pRetry); _pRetry = null; }
      if (_pws)   { try { _pws.close(); } catch (e) {} _pws = null; }
      if (_pPing) { clearInterval(_pPing); _pPing = null; }
      try { _pws = new WebSocket(BITGET_WS_PUBLIC); } catch (e) { _retry(); return; }
      _pws.onopen = function () {
        _pRetryCount = 0;
        try {
          _pws.send(JSON.stringify({
            op: 'subscribe',
            args: [{ instType: BITGET_PRODUCT_TYPE, channel: 'ticker', instId: BITGET_SYMBOL }]
          }));
        } catch (e) {}
        _pPing = setInterval(function () {
          if (_pws && _pws.readyState === 1) try { _pws.send('ping'); } catch (e) {}
        }, 25000);
      };
      _pws.onmessage = function (ev) {
        try {
          if (typeof ev.data === 'string' && ev.data === 'pong') return;
          var d = JSON.parse(ev.data);
          if (d.event) return;
          if (!d.data || !Array.isArray(d.data) || !d.data.length) return;
          var t = d.data[0];
          _publish(t.lastPr || t.markPrice || t.indexPrice);
        } catch (e) {}
      };
      _pws.onclose = function () { _retry(); };
      _pws.onerror = function () { try { _pws.close(); } catch (e) {} };
    }
    function _retry() {
      if (_pPing) { clearInterval(_pPing); _pPing = null; }
      if (_pRetry) return;
      var delay = Math.min(15000, 1000 * Math.pow(1.6, Math.min(_pRetryCount++, 6)));
      _pRetry = setTimeout(function () { _pRetry = null; _connect(); }, delay);
    }
    _connect();
  })();

  var POLL_MS = 3000;
  function _posSize(p) { return Math.abs(parseFloat((p && (p.total || p.size || p.holdSize)) || 0)); }
  async function _pollPositions() {
    var X = window.BitgetExecutor;
    if (!X || typeof X.getAllPositions !== 'function') return;
    try {
      var raw = await X.getAllPositions();
      var positions = (Array.isArray(raw) ? raw : []).filter(function (p) { return _posSize(p) > 0; });
      var tpslOrders = [];
      if (positions.length > 0 && typeof X.getTpslOrders === 'function') {
        try {
          var ro = await X.getTpslOrders();
          tpslOrders = Array.isArray(ro) ? ro
            : (ro && Array.isArray(ro.entrustedList)) ? ro.entrustedList
            : (ro && ro.data && Array.isArray(ro.data.entrustedList)) ? ro.data.entrustedList
            : (ro && ro.data && Array.isArray(ro.data)) ? ro.data : [];
          if (tpslOrders.length) {
            positions.forEach(function (pos) {
              var hs = (pos.holdSide || 'long').toLowerCase();
              tpslOrders.forEach(function (ord) {
                var os = ((ord.holdSide || ord.posSide) || '').toLowerCase();
                if (os && os !== hs) return;
                var pt = (ord.planType || '').toLowerCase();
                var px = parseFloat(ord.triggerPrice || ord.executePrice || ord.orderPrice || 0);
                if (!px) return;
                if (pt === 'pos_loss' || pt === 'loss' || pt.indexOf('loss') >= 0) pos.stopLossPrice = px;
                else if (pt === 'pos_profit' || pt === 'profit' || pt.indexOf('profit') >= 0 || pt.indexOf('surplus') >= 0) pos.takeProfitPrice = px;
              });
            });
          }
        } catch (e) { /* tpsl transient */ }
      }
      window.BCWPositions = { positions: positions, tpslOrders: tpslOrders };
    } catch (e) { /* proxy down / transient */ }
  }
  _pollPositions();
  setTimeout(_pollPositions, 800);
  setInterval(_pollPositions, POLL_MS);
})();
</script>
<script>
(function() {
  function init() {
    var container = document.getElementById('fp-container');
    if (!container) return setTimeout(init, 50);
    // NOTE: do NOT mount() before start(). start()->open()->_ensureOverlay() already
    // scaffolds the fullscreen overlay (same path the dashboard FP button uses). A prior
    // mount() builds a first scaffold (incl. the order panel) into #fp-container, then the
    // overlay scaffold repoints _host and _buildOrderPanel() early-returns, leaving the
    // TRADE panel orphaned BEHIND the z-index:99999 overlay -> pressing TRADE shows nothing.
    KiyotakaFootprint.start();
  }
  init();
})();
